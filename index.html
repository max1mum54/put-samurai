<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151313"><meta name="apple-mobile-web-app-capable" content="yes"><title>Путь самурая</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{--bg:#121010;--p:#211c1b;--line:#59423a;--txt:#f3e8dc;--muted:#b6a69a;--red:#9e3530;--gold:#dcb36e;--green:#7ca985}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#422929,#151212 55%,#101010);color:var(--txt);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:90px}.app{max-width:720px;margin:auto;padding:0 14px}header{padding:calc(12px + env(safe-area-inset-top)) 4px;display:flex;justify-content:space-between;align-items:center}.brand{font:22px Georgia;display:flex;gap:9px;align-items:center}.mark{background:#9e3530;border-radius:50%;width:38px;height:38px;display:grid;place-items:center}h1{font:27px Georgia;margin:14px 0}h2{font:20px Georgia;margin:0 0 12px}.muted,.small{color:var(--muted)}.small{font-size:12px}.card{background:linear-gradient(145deg,#282120,#1a1717);border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:9px}.btn{background:#442522;border:1px solid #875148;color:var(--txt);border-radius:11px;padding:10px 13px}.btn.primary{background:linear-gradient(120deg,#a33b35,#642321)}.btn.ghost{background:#211d1d;border-color:#51413a}input,textarea,select{width:100%;background:#151313;color:var(--txt);border:1px solid #58443d;border-radius:10px;padding:11px;margin:5px 0 10px}textarea{min-height:80px}label{font-size:12px;color:var(--muted)}.progress{height:9px;background:#100f0f;border-radius:20px;overflow:hidden;margin-top:8px}.progress span{display:block;height:100%;background:linear-gradient(90deg,#a33b35,#e1b56f)}.task{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #403330}.task:last-child{border:0}.task input{width:21px;height:21px;margin:0;accent-color:#a33b35}.taskname{flex:1}.task.done .taskname{text-decoration:line-through;color:#93a398}.badge{background:#382b27;color:var(--gold);border-radius:20px;padding:4px 8px;font-size:11px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#171414;border:1px solid #403330;border-radius:12px;padding:11px}.stat strong{display:block;font-size:22px;margin-top:4px}.tabs{display:flex;gap:7px;overflow:auto;margin:10px 0}.tab{white-space:nowrap;border:1px solid #55413a;border-radius:20px;padding:8px 12px;background:#211d1d;color:var(--muted)}.tab.active{background:#68302c;color:white}.item{padding:11px;background:#191616;border:1px solid #42332f;border-radius:12px;margin:8px 0}.nav{position:fixed;bottom:0;left:0;right:0;background:#171414f5;border-top:1px solid #4a3833;padding:8px 4px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center}.navin{width:min(720px,100%);display:grid;grid-template-columns:repeat(5,1fr)}.nav button{border:0;background:none;color:#b7a79b;font-size:10px;padding:6px 1px;border-radius:10px}.nav button b{display:block;font-size:20px;font-weight:400}.nav button.active{background:#5c2926;color:white}.week{display:grid;grid-template-columns:repeat(7,76px);gap:6px;overflow:auto}.day{background:#171414;border:1px solid #4a3833;border-radius:10px;padding:7px;min-height:100px}.mini{font-size:11px;background:#3a2824;border-left:3px solid var(--gold);padding:6px;margin:5px 0;border-radius:6px}.tree{padding-left:12px;border-left:1px solid #805348}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:10;align-items:flex-end}.modal.show{display:flex}.sheet{background:#211c1b;border:1px solid #694c42;border-radius:20px 20px 0 0;width:100%;max-width:720px;margin:auto;max-height:90vh;overflow:auto;padding:18px 15px calc(22px + env(safe-area-inset-bottom))}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.empty{text-align:center;color:var(--muted);padding:18px}.samurai{font-size:72px;text-align:center;padding:24px;background:linear-gradient(120deg,#412625,#1c1717);border-radius:14px}.gold{color:var(--gold)}

/* refined visual layer */
body{background:radial-gradient(ellipse at 50% -12%,#53302b 0,#211716 34%,#111010 78%);letter-spacing:.01em}
.app{max-width:820px;padding-left:20px;padding-right:20px}
header{padding-bottom:18px}.brand{font-weight:600;letter-spacing:.02em}.mark{box-shadow:0 0 22px #a43b3544;border:1px solid #c56c5d}
h1{font-size:32px;letter-spacing:.01em;margin:18px 0 20px}
.card{background:linear-gradient(145deg,rgba(43,34,32,.97),rgba(25,21,21,.98));border-color:#5b4038;box-shadow:0 12px 30px #0004, inset 0 1px #ffffff08;padding:18px}
.btn{transition:transform .15s ease,filter .15s ease;box-shadow:0 4px 12px #0002}.btn:active{transform:scale(.98);filter:brightness(1.15)}
.btn.primary{background:linear-gradient(135deg,#b34a40,#792b28);border-color:#c26758;box-shadow:0 5px 18px #8f302b33}
.item{background:linear-gradient(120deg,#211b1a,#191515);border-color:#554039}
.modal{backdrop-filter:blur(7px);background:#080606b8;align-items:center;padding:18px}
.sheet{border-radius:22px;border:1px solid #76554a;box-shadow:0 24px 80px #000a;max-width:560px;padding:22px;background:linear-gradient(145deg,#2a2220,#191515)}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.modal-head h2{font-size:24px;margin:5px 0}
.eyebrow{font-size:10px;letter-spacing:.16em;color:#d9ad79;font-weight:700}
.close-btn{border:1px solid #5a423b;background:#332725;color:#e9d9cb;border-radius:50%;width:34px;height:34px;font-size:22px;line-height:1}
.day-picker{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:18px 0 12px}
.day-choice{display:flex;flex-direction:column;align-items:center;gap:5px;padding:13px 6px;border:1px solid #59423b;border-radius:14px;background:#1b1716;cursor:pointer;transition:.15s}
.day-choice:has(input:checked){background:linear-gradient(145deg,#69312c,#3d211f);border-color:#d08b6c;box-shadow:0 0 0 1px #d08b6c33}
.day-choice input{width:17px;height:17px;margin:0;accent-color:#d99b70}
.day-name{font-size:14px;font-weight:700;color:#f3e5d8}
.day-date{font-size:12px;color:#bca99a}
.selection-note{font-size:12px;color:#d8b58d;margin:10px 0 14px;text-align:center}
.wide{width:100%;padding:13px}
@media(max-width:480px){.day-picker{grid-template-columns:repeat(4,1fr)}.modal{padding:10px}.sheet{padding:18px}}
</style></head><body><div class="app"><header><div class="brand"><span class="mark">⛩</span><span>Путь самурая</span></div><span class="small" id="date"></span></header><main id="screen"></main></div><div class="nav"><div class="navin"><button data-p="notes"> <b>▤</b>Заметки</button><button data-p="week"><b>▦</b>Неделя</button><button data-p="today" class="active"><b>◉</b>Сегодня</button><button data-p="character"><b>侍</b>Персонаж</button><button data-p="more"><b>⋯</b>Разное</button></div></div><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const $=s=>document.querySelector(s),id=()=>Math.random().toString(36).slice(2),iso=()=>new Date().toLocaleDateString('en-CA'),add=(d,n)=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toLocaleDateString('en-CA')},ws=d=>add(d,-((new Date(d+'T12:00:00').getDay()+6)%7)),fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'}),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D=JSON.parse(localStorage.getItem('samurai_app')||'null')||{profile:{name:'Самурай',age:25,level:1,xp:0,total:0},tasks:[],routines:[],notes:[],goals:[],weights:[],steps:[],measures:[],exercises:[],workouts:[],transactions:[],reports:[],week:ws(iso()),locked:false};
let page='today',sub='training',month=iso().slice(0,7);function save(){localStorage.setItem('samurai_app',JSON.stringify(D))}function modal(s){$('#sheet').innerHTML=s;$('#modal').classList.add('show')}function close(){ $('#modal').classList.remove('show')}$('#modal').onclick=e=>{if(e.target.id==='modal')close()};$('#date').textContent=fmt(iso());
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>go(b.dataset.p));function go(p){page=p;document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===p));render()}
function tasks(d){return D.tasks.filter(t=>t.date===d)}function prog(d){let a=tasks(d);return a.length?Math.round(a.filter(t=>['done','cancel'].includes(t.status)).length/a.length*100):0}
function xp(n){D.profile.total=Math.max(0,D.profile.total+n);D.profile.xp+=n;while(D.profile.xp>=1000){D.profile.xp-=1000;D.profile.level++}while(D.profile.xp<0&&D.profile.level>1){D.profile.level--;D.profile.xp+=1000}}
function render(){if(page==='today')today();if(page==='week')week();if(page==='notes')notes();if(page==='character')character();if(page==='more')more()}
function today(){let a=tasks(iso());$('#screen').innerHTML=`<h1>Сегодня</h1><div class="card"><div class="small">${new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}</div><h2>«Путь в тысячу ли начинается с первого шага»</h2><div class="small">Лао-цзы</div></div><div class="card"><div class="row"><h2>Прогресс дня</h2><b class="gold">${prog(iso())}%</b></div><div class="progress"><span style="width:${prog(iso())}%"></span></div></div><div class="card"><div class="row"><h2>Задачи</h2><span class="badge">${a.length}</span></div>${a.map(t=>`<div class="task"><input type="checkbox" ${t.status==='done'?'checked':''} onchange="check('${t.id}',this.checked)"><div class="taskname">${esc(t.title)}<div class="small">${esc(t.kind||'Задача')} · ${t.status==='cancel'?'Отменено':t.status==='missed'?'Не выполнено':''}</div></div><button class="btn ghost" onclick="taskMenu('${t.id}')">⋯</button></div>`).join('')||'<div class="empty">Задач нет. Создай план в разделе «Неделя».</div>'}</div><p class="small">Отмена по обстоятельствам закрывает дневной прогресс, но не считается выполнением и не даёт XP.</p>`}
function check(i,v){let t=D.tasks.find(x=>x.id===i);if(v&&t.status!=='done'&&!t.xp){xp(20);t.xp=true;t.status='done'}else if(!v&&t.xp){xp(-20);t.xp=false;t.status='pending'}save();today()}
function taskMenu(i){modal(`<h2>Статус задачи</h2><button class="btn" onclick="status('${i}','cancel')">Отменить по обстоятельствам</button> <button class="btn ghost" onclick="status('${i}','pending')">Вернуть в ожидание</button>`)}
function status(i,s){let t=D.tasks.find(x=>x.id===i);if(t.xp&&s!=='done'){xp(-20);t.xp=false}t.status=s;save();close();today()}
function week(){let ds=Array.from({length:7},(_,i)=>add(D.week,i));$('#screen').innerHTML=`<h1>Неделя</h1><div class="card"><div class="row"><div><h2>${fmt(ds[0])} — ${fmt(ds[6])}</h2><div class="small">${D.locked?'План закреплён':'План редактируется'}</div></div><button class="btn ${D.locked?'ghost':'primary'}" onclick="D.locked=!D.locked;save();week()">${D.locked?'🔒 Изменить':'Закрепить'}</button></div></div><div class="card"><h2>Расписание</h2><div class="week">${ds.map(d=>`<div class="day"><b>${['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][new Date(d+'T12:00:00').getDay()]} ${d.slice(8)}</b>${tasks(d).map(t=>`<div class="mini">${esc(t.title)} ${t.status==='done'?'✓':t.status==='cancel'?'○':''}</div>`).join('')}<button class="btn ghost" ${D.locked?'disabled':''} onclick="oneOff('${d}')">＋</button></div>`).join('')}</div></div><div class="card"><div class="row"><h2>Рутины</h2><button class="btn primary" ${D.locked?'disabled':''} onclick="routine()">＋ Создать</button></div>${D.routines.map(r=>`<div class="item"><b>${esc(r.title)}</b> · ${r.count} раз/нед. <button class="btn ghost" onclick="distribute('${r.id}')" ${D.locked?'disabled':''}>Распределить</button></div>`).join('')||'<div class="empty">Создай повторяющиеся задачи, затем распредели их по дням.</div>'}<button class="btn ghost" onclick="copyWeek()" ${D.locked?'disabled':''}>Копировать предыдущую неделю</button></div>`}
function routine(){modal(`<h2>Новая рутина</h2><label>Название</label><input id="rt" placeholder="Например, тренировка"><label>Повторений в неделю</label><input id="rc" type="number" min="1" max="7" value="3"><button class="btn primary" onclick="saveRoutineFromModal()">Создать</button>`)}
function saveRoutineFromModal(){const title=document.getElementById("rt").value.trim();const count=Math.max(1,Math.min(7,Number(document.getElementById("rc").value)||1));if(!title){alert("Введи название задачи");return;}D.routines.push({id:id(),title,count});save();close();week();}
function distribute(i){
 const r=D.routines.find(x=>x.id===i);
 if(!r)return;
 const names=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
 const dates=Array.from({length:7},(_,n)=>add(D.week,n));
 modal(`<div class="modal-head"><div><div class="eyebrow">ПЛАНИРОВАНИЕ НЕДЕЛИ</div><h2>Распределить задачу</h2><p class="muted">${esc(r.title)} · выбери ${r.count} ${r.count===1?'день':'дня'}</p></div><button class="close-btn" onclick="close()">×</button></div><div class="day-picker">${dates.map((d,n)=>`<label class="day-choice"><input class="pick" type="checkbox" value="${d}"><span class="day-name">${names[n]}</span><span class="day-date">${d.slice(8,10)}.${d.slice(5,7)}</span></label>`).join('')}</div><div class="selection-note" id="selectionNote">Выбрано: 0 из ${r.count}</div><button class="btn primary wide" onclick="applyDistribution('${i}')">Добавить в расписание</button>`);
 document.querySelectorAll('.pick').forEach(c=>c.addEventListener('change',updatePickCount));
 updatePickCount();
}
function updatePickCount(){const count=document.querySelectorAll('.pick:checked').length;const note=document.getElementById('selectionNote');if(note)note.textContent='Выбрано: '+count;}
function applyDistribution(i){
 const r=D.routines.find(x=>x.id===i);
 const chosen=[...document.querySelectorAll('.pick:checked')].map(x=>x.value);
 if(!r){alert('Не удалось найти задачу. Закрой окно и попробуй снова.');return;}
 if(chosen.length!==Number(r.count)){alert('Выбери ровно '+r.count+' дня. Сейчас выбрано: '+chosen.length);return;}
 chosen.forEach(date=>D.tasks.push({id:id(),title:r.title,date,kind:'Рутина',status:'pending'}));
 save();close();week();
}
function oneOff(d){if(D.locked)return;modal(`<h2>Разовая задача</h2><input id="ot" placeholder="Название"><input id="od" type="date" value="${d}"><button class="btn primary" onclick="saveOneOffFromModal()">Добавить</button>`)}
function saveOneOffFromModal(){const title=document.getElementById("ot").value.trim();const date=document.getElementById("od").value;if(!title){alert("Введи название задачи");return;}if(!date){alert("Выбери дату");return;}D.tasks.push({id:id(),title,date,kind:"Разовая",status:"pending"});save();close();week();}
function copyWeek(){let prev=add(D.week,-7);D.tasks.filter(t=>t.date>=prev&&t.date< D.week).forEach(t=>D.tasks.push({...t,id:id(),date:add(t.date,7),status:'pending',xp:false}));save();week()}
function notes(){ $('#screen').innerHTML=`<h1>Заметки</h1><div class="card"><div class="row"><h2>Блокнот</h2><button class="btn primary" onclick="noteEdit()">＋ Новая</button></div><input id="nq" placeholder="Поиск" oninput="noteFilter()"><div id="nl">${noteList(D.notes)}</div></div>`}
function noteList(a){return a.slice().sort((x,y)=>(y.pin-x.pin)||y.date.localeCompare(x.date)).map(n=>`<div class="item" onclick="noteEdit('${n.id}')"><b>${n.pin?'📌 ':''}${esc(n.title)}</b><div class="small">${esc(n.body.slice(0,120))}</div></div>`).join('')||'<div class="empty">Заметок пока нет.</div>'}
function noteFilter(){let q=$('#nq').value.toLowerCase();$('#nl').innerHTML=noteList(D.notes.filter(n=>(n.title+n.body).toLowerCase().includes(q)))}
function noteEdit(i){let n=D.notes.find(x=>x.id===i)||{title:'',body:'',pin:false};modal(`<h2>Заметка</h2><label>Заголовок</label><input id="nt" value="${esc(n.title)}"><label>Текст</label><textarea id="nb">${esc(n.body)}</textarea><label><input id="np" type="checkbox" ${n.pin?'checked':''} style="width:auto"> Закрепить</label><button class="btn primary" onclick="let o={id:${JSON.stringify(i||'')}||id(),title:$('#nt').value,body:$('#nb').value,pin:$('#np').checked,date:iso()};let k=D.notes.findIndex(x=>x.id===o.id);k<0?D.notes.push(o):D.notes[k]=o;save();close();notes()">${i?'Сохранить':'Создать'}</button>${i?`<button class="btn ghost" onclick="D.notes=D.notes.filter(x=>x.id!=='${i}');save();close();notes()">Удалить</button>`:''}`)}
function character(){let p=D.profile;$('#screen').innerHTML=`<h1>Персонаж</h1><div class="card"><div class="samurai">侍</div><div class="row"><div><div class="small">Уровень</div><div style="font:48px Georgia;color:var(--gold)">${p.level}</div></div><div style="flex:1"><div class="row"><b>Опыт (XP)</b><b class="gold">${p.xp}/1000</b></div><div class="progress"><span style="width:${p.xp/10}%"></span></div><div class="small">До следующего уровня: ${1000-p.xp} XP</div></div></div><hr><div class="row"><b>${esc(p.name)}</b><span class="small">Возраст: ${p.age}</span><button class="btn ghost" onclick="profileEdit()">Изменить</button></div></div><div class="tabs"><button class="tab active" onclick="charSub('goals')">Цели года</button><button class="tab" onclick="charSub('report')">Отчёт недели</button><button class="tab" onclick="charSub('stats')">Статистика</button></div><div id="cs">${goalPanel()}</div>`}
function profileEdit(){modal(`<h2>Профиль</h2><input id="pn" value="${esc(D.profile.name)}"><input id="pa" type="number" value="${D.profile.age}"><button class="btn primary" onclick="D.profile.name=$('#pn').value;D.profile.age=+$('#pa').value;save();close();character()">Сохранить</button>`)}
function charSub(s){document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',['goals','report','stats'][i]===s));$('#cs').innerHTML=s==='goals'?goalPanel():s==='report'?reportPanel():`<div class="card"><h2>Статистика</h2><div class="grid2"><div class="stat">Уровень<strong>${D.profile.level}</strong></div><div class="stat">Всего XP<strong>${D.profile.total}</strong></div><div class="stat">Задач выполнено<strong>${D.tasks.filter(t=>t.status==='done').length}</strong></div><div class="stat">Целей<strong>${D.goals.length}</strong></div></div></div>`}
function goalPanel(){return `<div class="card"><div class="row"><h2>Цели года</h2><button class="btn primary" onclick="newGoal()">＋ Создать</button></div>${D.goals.map(g=>`<div class="item" onclick="goalOpen('${g.id}')"><div class="row"><b>${esc(g.title)}</b><span class="gold">${goalPct(g)}%</span></div><div class="progress"><span style="width:${goalPct(g)}%"></span></div><div class="small">Этап: ${esc(g.stage)} · Обновлено: ${g.updated}</div></div>`).join('')||'<div class="empty">Создай цель, пункты, подпункты и их процентный вес.</div>'}</div>`}
function goalPct(g){let a=[];function w(ns){ns.forEach(n=>{a.push(n);w(n.children||[])})}w(g.nodes);return Math.round(a.filter(n=>n.done).reduce((s,n)=>s+n.weight,0))}
function newGoal(){modal(`<h2>Новая цель</h2><label>Название</label><input id="gt"><label>Текущий этап</label><input id="gs" placeholder="Начало"><button class="btn primary" onclick="createGoal()">Создать</button>`)}
function createGoal(){let g={id:id(),title:$('#gt').value.trim(),stage:$('#gs').value||'Начало',updated:iso(),nodes:[]};if(!g.title)return;D.goals.push(g);save();close();goalOpen(g.id)}
function goalOpen(i){let g=D.goals.find(x=>x.id===i);function tree(a){return a.map(n=>`<div class="item"><label><input type="checkbox" style="width:auto" ${n.done?'checked':''} onchange="goalCheck('${i}','${n.id}',this.checked)"> ${esc(n.title)} · ${n.weight}%</label><div class="actions"><button class="btn ghost" onclick="goalAdd('${i}','${n.id}')">＋ Подпункт</button></div>${tree(n.children||[])}</div>`).join('')}modal(`<h2>${esc(g.title)}</h2><div class="small">Прогресс ${goalPct(g)}% · Обновлено ${g.updated}</div><div class="progress"><span style="width:${goalPct(g)}%"></span></div><div class="tree">${tree(g.nodes)}</div><button class="btn ghost" onclick="goalAdd('${i}','')">＋ Добавить пункт</button><label>Текущий этап</label><input id="gst" value="${esc(g.stage)}"><button class="btn primary" onclick="g.stage=$('#gst').value;g.updated=iso();save();close();character()" id="saveStage">Сохранить этап</button>`);$('#saveStage').onclick=()=>{g.stage=$('#gst').value;g.updated=iso();save();close();character()}}
function goalAdd(i,parent){modal(`<h2>Пункт цели</h2><input id="gnt" placeholder="Название"><label>Вес в процентах</label><input id="gnw" type="number" value="10"><button class="btn primary" onclick="let n={id:id(),title:$('#gnt').value,weight:+$('#gnw').value||0,done:false,children:[]};let g=D.goals.find(x=>x.id==='${i}');let find=a=>{for(let z of a){if(z.id==='${parent}')return z;let q=find(z.children||[]);if(q)return q}};let p='${parent}'?find(g.nodes):null;(p?p.children:g.nodes).push(n);g.updated=iso();save();close();goalOpen('${i}')">Добавить</button>`)}
function goalCheck(i,nid,v){let g=D.goals.find(x=>x.id===i);function f(a){for(let n of a){if(n.id===nid){n.done=v;return true}if(f(n.children||[]))return true}return false}f(g.nodes);g.updated=iso();save();goalOpen(i)}
function reportPanel(){return `<div class="card"><h2>Еженедельный отчёт</h2><p class="muted">Появляется в понедельник за закрытую предыдущую неделю. Остальные разделы доступны.</p><button class="btn primary" onclick="report()">Заполнить отчёт</button></div>`}
function report(){let start=add(ws(iso()),-7),ds=Array.from({length:7},(_,i)=>add(start,i)),a=D.tasks.filter(t=>ds.includes(t.date));modal(`<h2>Отчёт за неделю ${fmt(start)}</h2><div class="grid2"><div class="stat">Запланировано<strong>${a.length}</strong></div><div class="stat">Выполнено<strong>${a.filter(t=>t.status==='done').length}</strong></div><div class="stat">Отменено<strong>${a.filter(t=>t.status==='cancel').length}</strong></div><div class="stat">Пропущено<strong>${a.filter(t=>t.status==='missed'||!t.status).length}</strong></div></div><hr><h3>Отметь выполненные пункты годовых целей</h3>${D.goals.map(g=>`<div class="item"><b>${esc(g.title)}</b>${reportGoalNodes(g.nodes,g.id)}</div>`).join('')||'<p class="muted">Годовых целей пока нет.</p>'}<label>Чем доволен?</label><textarea id="rg"></textarea><label>Что не получилось?</label><textarea id="rb"></textarea><label>Что изменить на следующей неделе?</label><textarea id="rn"></textarea><button class="btn primary" onclick="document.querySelectorAll('.rp:checked').forEach(c=>goalCheckDirect(c.dataset.g,c.dataset.n));D.reports.push({week:'${start}',good:$('#rg').value,bad:$('#rb').value,next:$('#rn').value});save();close();character()">Подтвердить отчёт</button>`)}
function reportGoalNodes(ns,g){return ns.map(n=>`<label><input class="rp" data-g="${g}" data-n="${n.id}" type="checkbox" ${n.done?'checked disabled':''} style="width:auto"> ${esc(n.title)} (${n.weight}%)</label>${reportGoalNodes(n.children||[],g)}`).join('')}
function goalCheckDirect(gid,nid){let g=D.goals.find(x=>x.id===gid);function f(a){for(let n of a){if(n.id===nid){n.done=true;g.updated=iso();return}f(n.children||[])}}f(g.nodes)}
function more(){ $('#screen').innerHTML=`<h1>Разное</h1><div class="grid2"><button class="card" onclick="moreSub('training')">🏋️<h2>Тренировки</h2><span class="small">Дневник и библиотека</span></button><button class="card" onclick="moreSub('health')">♥<h2>Здоровье</h2><span class="small">Вес, замеры, шаги</span></button><button class="card" onclick="moreSub('finance')">₴<h2>Финансы</h2><span class="small">Доходы и расходы</span></button><button class="card" onclick="moreSub('calendar')">▦<h2>Календарь</h2><span class="small">История дней</span></button></div><div id="ms">${morePanel()}</div>`}
function moreSub(s){sub=s;$('#ms').innerHTML=morePanel()}
function morePanel(){if(sub==='training')return `<div class="card"><div class="row"><h2>Дневник тренировок</h2><button class="btn primary" onclick="newWorkout()">＋</button></div><button class="btn ghost" onclick="newExercise()">Библиотека упражнений</button>${D.workouts.map(w=>`<div class="item" onclick="workoutOpen('${w.id}')"><b>${esc(w.title)}</b><div class="small">${w.date} · ${w.entries.length} упражнений</div></div>`).join('')||'<div class="empty">Тренировок пока нет.</div>'}</div>`;if(sub==='health')return `<div class="card"><h2>Здоровье</h2><div class="actions"><button class="btn primary" onclick="healthAdd('weight')">＋ Вес</button><button class="btn ghost" onclick="healthAdd('steps')">＋ Шаги</button><button class="btn ghost" onclick="healthAdd('measure')">＋ Замер</button></div><h3>Вес</h3>${D.weights.slice().reverse().map(x=>`<div class="item">${x.date} · ${x.v} кг</div>`).join('')||'<p class="muted">Нет записей</p>'}<h3>Шаги</h3>${D.steps.slice().reverse().map(x=>`<div class="item">${x.date} · ${x.v}</div>`).join('')}<h3>Замеры</h3>${D.measures.map(x=>`<div class="item">${x.date} · ${esc(x.name)}: ${x.v} см</div>`).join('')}</div>`;if(sub==='finance')return `<div class="card"><div class="row"><h2>Финансы · UAH</h2><button class="btn primary" onclick="transaction()">＋</button></div><div class="stat">Баланс операций<strong>${D.transactions.reduce((s,t)=>s+(t.type==='in'?t.v:-t.v),0).toFixed(2)} ₴</strong></div><p class="small">В этой версии операции учитываются в гривнах. Мультивалютность, накопления и автоматический курс НБУ — следующий этап.</p>${D.transactions.slice().reverse().map(t=>`<div class="item">${esc(t.title)} · ${t.type==='in'?'+':'−'}${t.v} ₴<div class="small">${t.date} · ${esc(t.cat)}</div></div>`).join('')}</div>`;return calendar()}
function newExercise(){modal(`<h2>Упражнение в библиотеку</h2><input id="en" placeholder="Название"><select id="et"><option>Силовое</option><option>На время</option><option>Продолжительность</option><option>Расстояние</option><option>Пользовательское</option></select><button class="btn primary" onclick="D.exercises.push({id:id(),name:$('#en').value,type:$('#et').value});save();close();moreSub('training')">Сохранить</button>`)}
function newWorkout(){modal(`<h2>Новая тренировка</h2><input id="wt" placeholder="Название тренировки"><input id="wd" type="date" value="${iso()}"><button class="btn primary" onclick="D.workouts.unshift({id:id(),title:$('#wt').value,date:$('#wd').value,entries:[]});save();close();moreSub('training')">Создать</button>`)}
function workoutOpen(i){let w=D.workouts.find(x=>x.id===i);modal(`<h2>${esc(w.title)}</h2>${w.entries.map(e=>`<div class="item"><b>${esc(e.name)}</b><div class="small">${esc(e.result)}</div></div>`).join('')}<label>Упражнение</label><select id="we">${D.exercises.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select><label>Подходы / вес / повторения / время / расстояние</label><textarea id="wr"></textarea><button class="btn primary" onclick="let e=D.exercises.find(x=>x.id===$('#we').value);if(!e){alert('Добавь упражнение в библиотеку');return}w.entries.push({name:e.name,result:$('#wr').value});save();close();workoutOpen('${i}')">Добавить результат</button>`)}
function healthAdd(t){modal(`<h2>${t==='weight'?'Вес':t==='steps'?'Шаги':'Замер тела'}</h2><input id="hd" type="date" value="${iso()}">${t==='measure'?'<input id="hn" placeholder="Талия, грудь, бицепс...">':''}<input id="hv" type="number" step=".1" placeholder="${t==='weight'?'кг':t==='steps'?'шаги':'см'}"><button class="btn primary" onclick="let o={date:$('#hd').value,v:+$('#hv').value};${t==='weight'?'D.weights.push(o)':t==='steps'?'D.steps.push(o)':"D.measures.push({...o,name:$('#hn').value})"};save();close();moreSub('health')">Сохранить</button>`)}
function transaction(){modal(`<h2>Операция</h2><select id="tt"><option value="out">Расход</option><option value="in">Доход</option></select><input id="tn" placeholder="Название"><input id="tc" placeholder="Категория / подкатегория"><input id="tv" type="number" step=".01" placeholder="Сумма, грн"><input id="td" type="date" value="${iso()}"><button class="btn primary" onclick="D.transactions.push({type:$('#tt').value,title:$('#tn').value,cat:$('#tc').value,v:+$('#tv').value,date:$('#td').value});save();close();moreSub('finance')">Сохранить</button>`)}
function calendar(){let [y,m]=month.split('-').map(Number),n=new Date(y,m,0).getDate(),off=(new Date(y,m-1,1).getDay()+6)%7;return `<div class="card"><div class="row"><button class="btn ghost" onclick="monthShift(-1)">‹</button><h2>${new Date(y,m-1,1).toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</h2><button class="btn ghost" onclick="monthShift(1)">›</button></div><div class="grid2" style="grid-template-columns:repeat(7,1fr)">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<span class="small">${x}</span>`).join('')}${Array(off).fill('<span></span>').join('')}${Array.from({length:n},(_,i)=>{let d=`${y}-${String(m).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`;return `<button class="btn ghost" onclick="dayInfo('${d}')">${i+1}<div class="small">${tasks(d).length?tasks(d).filter(t=>t.status==='done').length+'/'+tasks(d).length:''}</div></button>`}).join('')}</div></div>`}
function monthShift(n){let d=new Date(month+'-15T12:00:00');d.setMonth(d.getMonth()+n);month=d.toLocaleDateString('en-CA').slice(0,7);moreSub('calendar')}
function dayInfo(d){let a=tasks(d);modal(`<h2>${fmt(d)}</h2><div class="grid2"><div class="stat">Запланировано<strong>${a.length}</strong></div><div class="stat">Выполнено<strong>${a.filter(t=>t.status==='done').length}</strong></div><div class="stat">Отменено<strong>${a.filter(t=>t.status==='cancel').length}</strong></div><div class="stat">Не выполнено<strong>${a.filter(t=>t.status==='missed'||!t.status).length}</strong></div></div><div class="progress"><span style="width:${prog(d)}%"></span></div>${a.map(t=>`<div class="item">${esc(t.title)} · ${t.status||'ожидает'}</div>`).join('')}`)}
// Close past days and roll the weekly planner forward.
D.tasks.forEach(t=>{if(t.date<iso()&&!t.status)t.status='missed'});if(D.week!==ws(iso())){D.week=ws(iso());D.locked=false}save();render();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
